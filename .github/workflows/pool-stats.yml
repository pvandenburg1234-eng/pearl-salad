name: pool-stats

# Pull the wallet's Kryptex pool stats (balance, per-worker pool-side
# hashrate, network hashrate) and push them into the Axiom dataset next to the
# Salad container logs, for the PRL fleet dashboard.
# Needs the repository secret AXIOM_INGEST_TOKEN (ingest-only, one dataset).
#
# Manual only since 2026-09-26: the Cloudflare Worker in kryptex-worker/ does
# this every minute. GitHub's cron ran 3-5 h late, so the schedule was
# removed; keep this for a one-off run (Actions -> pool-stats -> Run workflow).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pool-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect and ingest
        shell: pwsh
        env:
          AXIOM_INGEST_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
        run: ./tools/kryptex-collect.ps1
