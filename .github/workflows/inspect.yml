# On-demand: what do the bundled miners actually link against and load, and
# which ROCm packages does the image carry? Used to decide whether the image
# can drop the rocm/dev base (compilers, LLVM, headers) for runtime-only
# packages on a plain Ubuntu base.
#
# Run from the Actions tab, or:  gh workflow run inspect.yml -f tag=v1.2.2
name: inspect-miner-deps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to inspect
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect
        run: |
          IMG="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pearl-salad:${{ inputs.tag }}"
          docker pull -q "$IMG"
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            apt-get update -qq >/dev/null && apt-get install -y -qq binutils file >/dev/null
            for b in /opt/krig/krig-miner /opt/srb/SRBMiner-MULTI /opt/bz/bzminer /opt/wildrig/wildrig-multi; do
              echo "=================================================================="
              echo "== $b"
              file -b "$b" | cut -c1-120
              echo "-- DT_NEEDED (direct link-time dependencies):"
              readelf -d "$b" 2>/dev/null | grep NEEDED | sed "s/.*\[\(.*\)\]/     \1/" || echo "     (static or not ELF)"
              echo "-- ldd resolution (== not found == means it would fail to start):"
              ldd "$b" 2>&1 | grep -iE "hip|hsa|amd|rocm|opencl|comgr|drm|numa|not found" | sed "s/^/     /" || true
              echo "-- GPU library names embedded in the binary (dlopen candidates):"
              strings -n 8 "$b" | grep -oE "lib(cuda|OpenCL|amdhip64|hiprtc|rocblas|hsa-runtime64|amd_comgr|amdocl64|rocm_smi|drm|drm_amdgpu|numa|rocprofiler)[A-Za-z0-9_.-]*\.so[.0-9]*" | sort -u | sed "s/^/     /" || true
            done
            echo "=================================================================="
            echo "== ROCm runtime libraries present in /opt/rocm/lib:"
            ls /opt/rocm/lib 2>/dev/null | grep -E "^lib(amdhip64|hsa-runtime|amd_comgr|amdocl64|hiprtc|rocm|drm|OpenCL|hsakmt)" | sed "s/^/     /"
            echo "== OpenCL ICD files:"
            for f in /etc/OpenCL/vendors/*; do echo "     $f -> $(cat $f)"; done
            echo "== what the ROCm runtime libs themselves need (transitive, for a minimal install):"
            for l in /opt/rocm/lib/libamdhip64.so /opt/rocm/lib/libamdocl64.so /opt/rocm/lib/libhsa-runtime64.so; do
              echo "   $l:"; ldd "$l" 2>/dev/null | grep -vE "linux-vdso|ld-linux|libc\.so|libm\.so|libpthread|libdl|librt|libgcc|libstdc" | sed "s/^/     /"
            done
            echo "== size breakdown:"
            du -sh /opt/rocm-7* /opt/rocm/lib /opt/rocm/llvm /opt/rocm/bin /opt/rocm/include /opt/krig /opt/srb /opt/bz /opt/wildrig 2>/dev/null | sed "s/^/     /"
            echo "== largest installed packages (MB):"
            dpkg-query -W -f="\${Installed-Size} \${Package}\n" | sort -rn | head -30 | awk "{ printf \"     %6.0f  %s\n\", \$1/1024, \$2 }"
            echo "== dpkg ROCm/HIP packages installed:"
            dpkg-query -W -f="\${Package} \${Version}\n" | grep -iE "rocm|hip|hsa|comgr|opencl|amdgpu|rocr" | sed "s/^/     /"
          '
