name: dashboard

# Test and deploy the PRL fleet dashboard (Cloudflare Worker in dashboard/).
# Test: Node run of dashboard/test/fleet.test.mjs + a wrangler dry-run bundle.
# Deploy: only on main, and only once the repository secrets exist:
#   CLOUDFLARE_API_TOKEN  Cloudflare API token ("Edit Cloudflare Workers" template)
#   AXIOM_QUERY_TOKEN     read-only Axiom query token, set as the Worker secret

on:
  push:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit test
        run: node test/fleet.test.mjs
      - name: Bundle (wrangler dry run)
        run: npx --yes wrangler@3 deploy --dry-run --outdir /tmp/bundle

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Cloudflare token
        id: has
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "token=$([ -n "$CF" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Skip (no CLOUDFLARE_API_TOKEN secret yet)
        if: steps.has.outputs.token != 'yes'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; dashboard not deployed."
      # Secrets set from a Windows prompt or pipe can carry a trailing CR/LF;
      # tokens never contain whitespace, so strip it before use.
      - name: Deploy
        if: steps.has.outputs.token == 'yes'
        working-directory: dashboard
        env:
          CF_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXQ_RAW: ${{ secrets.AXIOM_QUERY_TOKEN }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_RAW" | tr -d '[:space:]')"
          AXQ="$(printf '%s' "$AXQ_RAW" | tr -d '[:space:]')"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$AXQ"
          echo "cloudflare token length after trim: ${#CLOUDFLARE_API_TOKEN}; axiom query token length after trim: ${#AXQ}"
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print("token verify: success", r.get("success"), (r.get("result") or {}).get("status"), r.get("errors"))'
          npx --yes wrangler@3 deploy
          if [ -n "$AXQ" ]; then printf '%s' "$AXQ" | npx --yes wrangler@3 secret put AXIOM_QUERY_TOKEN; else echo "::warning::AXIOM_QUERY_TOKEN is not set"; fi
